name: Auto Update ASX Market Data

on:
  schedule:
    # 北京时间 09:00 (01:00 UTC)
    - cron: '0 1 * * 1-5'
    # 北京时间 11:30 (03:30 UTC)
    - cron: '30 3 * * 1-5'
    # 北京时间 15:00 (07:00 UTC)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 支持在 GitHub Web UI 上手动点击触发运行

permissions:
  contents: write # 必须赋予写权限才能将更新后的数据 push 回仓库

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip' # 缓存 pip 依赖加速构建

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analysis Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python algo_src/analysis_engine.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查 public/ 目录下文件是否有变动，避免没有变动时 commit 报错
          if [ -n "$(git status --porcelain public/)" ]; then
            git add public/
            git commit -m "chore: auto-update real-time market and backtest data [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes in market data."
          fi
